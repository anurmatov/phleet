name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Fleet.Conversations.Tests is excluded HERE and runs in `conversations-tests` below, which
      # is the job that has a real mysql:8.0 beside it.
      #
      # The exclusion is a filter rather than a project-level opt-out, because that suite FAILS
      # (never skips) without a database — which is the property that makes it evidence. Running it
      # here would fail this job for want of a service container it was never given, and "fix" that
      # by making it skip would put us back where a green summary proves nothing.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --filter "FullyQualifiedName!~Fleet.Conversations.Tests&FullyQualifiedName!~Fleet.Orchestrator.Tests.Migrations"
          --logger "console;verbosity=normal"

      # #341: proves the dashboard nginx re-resolves fleet-orchestrator per request
      # (Docker DNS) instead of caching one container address at config load.
      - name: Dashboard proxy re-resolves the orchestrator
        run: |
          bash tests/dashboard-proxy/run.sh

          # Negative control (issue AC3): the frozen pre-#341 conf (committed
          # fixture, NOT origin/main — that holds the fixed conf after merge)
          # must fail at P2 (the recreate), proving the harness still
          # reproduces the bug. CI on main stays green.
          set +e
          NGINX_CONF=tests/dashboard-proxy/nginx.legacy.conf bash tests/dashboard-proxy/run.sh
          NEGATIVE_RC=$?
          set -e
          echo "negative control exit=$NEGATIVE_RC (expected 1, failing at P2)"
          [ "$NEGATIVE_RC" -eq 1 ]

          # Built-image run (issue AC4): the dashboard image itself, no mounts.
          docker build -f src/fleet-dashboard/Dockerfile -t dashproxy-test:pr .
          DASHBOARD_IMAGE=dashproxy-test:pr bash tests/dashboard-proxy/run.sh

  # `npm test` is `node --test` over TypeScript sources, which needs Node >= 22.18 (type stripping
  # on by default) — the image build uses node:20 and only type-checks the tests.
  dashboard-tests:
    name: Dashboard build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/fleet-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  conversations-tests:
    name: Conversations store (MySQL)
    runs-on: ubuntu-latest

    # A SERVICE CONTAINER rather than Testcontainers: the runner provides it declaratively, so a
    # missing database fails the job at startup instead of surfacing as a skip halfway through.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: conversations-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      # The south round trip (#303) needs a real broker for the same reason it needs a real
      # database: the half being proven is that the loop CLOSES — publish, claim, disposition,
      # commit, ack — and every one of those steps is a property of the infrastructure rather than
      # of the code that calls it. RabbitMqFixture FAILS when this is absent; it never skips.
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The deployment runs as a DDL-LESS account and migrates with a separate one. Provisioning
      # both here means the suite exercises the same split, so a store method that quietly needed
      # DDL would fail in CI rather than in production.
      - name: Provision the migration and runtime accounts
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pconversations-ci <<'SQL'
          CREATE USER 'comms_ddl'@'%' IDENTIFIED BY 'ci-ddl';
          CREATE USER 'comms_runtime'@'%' IDENTIFIED BY 'ci-runtime';
          GRANT ALL PRIVILEGES ON *.* TO 'comms_ddl'@'%' WITH GRANT OPTION;
          GRANT SELECT, INSERT, UPDATE, DELETE ON *.* TO 'comms_runtime'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Fleet.Conversations (Release)
        run: dotnet build src/Fleet.Conversations/Fleet.Conversations.csproj --no-restore --configuration Release

      - name: Run the conversation store suite
        env:
          FLEET_CONVERSATIONS_MIGRATION_CONNECTION: "Server=127.0.0.1;Port=3306;User ID=comms_ddl;Password=ci-ddl;AllowPublicKeyRetrieval=true;"
          FLEET_CONVERSATIONS_CONNECTION: "Server=127.0.0.1;Port=3306;User ID=comms_runtime;Password=ci-runtime;AllowPublicKeyRetrieval=true;"
          FLEET_CONVERSATIONS_BROKER: "amqp://guest:guest@127.0.0.1:5672/"
        # ⚠️ `JournalS3*` is excluded here and runs in `media-s3-tests` below, which is the job that
        # has a SeaweedFS beside it. Same reason this job excludes nothing else: that suite FAILS
        # (never skips) without a bucket, and a job that ran it would fail for want of a fixture it
        # was never given — the exact shape that tempts someone to make the fixture skip, which is
        # how the media acceptance criteria would stop being evidence while the summary stayed green.
        run: >
          dotnet test tests/Fleet.Conversations.Tests --configuration Release
          --filter "FullyQualifiedName!~JournalS3"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=conversations.trx"
          --results-directory ${{ github.workspace }}/testresults

      # Evidence is "N executed, 0 not executed", READ FROM THE RESULT FILE and enforced.
      #
      # This step used to be an `echo`. A guard that cannot fail is not a guard: it asks a human to
      # read counts nobody reads, and it goes green on a run that executed nothing — which is
      # exactly the failure the whole fail-rather-than-skip design exists to prevent, arriving
      # through the step meant to catch it.
      - name: Refuse a run that skipped anything
        if: always()
        run: |
          set -euo pipefail
          trx="${{ github.workspace }}/testresults/conversations.trx"

          # A missing result file is a failure, not an absence of evidence: it means the suite did
          # not run at all, which is the strongest version of "skipped".
          if [ ! -f "$trx" ]; then
            echo "ERROR: no test result file at $trx — the suite did not run."
            exit 1
          fi

          counters=$(grep -o '<Counters[^>]*>' "$trx" | head -1)
          echo "$counters"

          read_count() {
            echo "$counters" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' || echo ""
          }

          executed=$(read_count executed)
          notExecuted=$(read_count notExecuted)
          passed=$(read_count passed)

          if [ -z "$executed" ] || [ -z "$notExecuted" ] || [ -z "$passed" ]; then
            echo "ERROR: could not read the counters out of $trx."
            exit 1
          fi

          if [ "$notExecuted" -ne 0 ]; then
            echo "ERROR: $notExecuted test(s) did not execute. A skipped integration suite is"
            echo "indistinguishable from a passing one in a summary; this job is evidence only at 0."
            exit 1
          fi

          if [ "$executed" -eq 0 ] || [ "$passed" -ne "$executed" ]; then
            echo "ERROR: executed=$executed passed=$passed — this job is evidence only when every"
            echo "test ran and passed against the real database."
            exit 1
          fi

          echo "$passed test(s) executed against mysql:8.0, 0 skipped."

  # The journal's media plane (#388). These are the only tests in the repo that put bytes through
  # the real AWS SDK into a real bucket, and they are the reason that plane exists: five defects in
  # S3ObjectStore passed every fake-bucket assertion in the suite and were only visible against a
  # server that answers. See tests/Fleet.Conversations.Tests/S3Fixture.cs for what the fixture
  # proves and — read that part — what it cannot.
  #
  # SeaweedFS rather than MinIO because MinIO publishes no public source for its images. Pinned by
  # digest, so "the fixture image changed underneath us" is a commit, not an outage.
  media-s3-tests:
    name: Journal media object store (S3)
    runs-on: ubuntu-latest

    # Only MySQL is declared as a service. The two SeaweedFS containers are started by a step
    # AFTER checkout (below), because a service container cannot be made to work here:
    #
    #   - `args` is not a valid key under `services.<id>`, and GitHub rejects the whole workflow
    #     file before any job runs when it appears.
    #   - `options` IS valid, but a free-form command in it fails container init: the runner
    #     prepends its own `docker create` arguments, so the `--entrypoint weed` and the `weed
    #     server …` words land where Docker expects flags. Measured on run 36651444927, where
    #     `Initialize containers` failed and every step after it was skipped.
    #   - `volumes:` on a service mounts the workspace BEFORE `actions/checkout` runs, and the
    #     workspace is empty at container init. The signed identity file was therefore missing at
    #     start — a container that cannot read its own `-s3.iam.config` is not a signed bucket.
    #
    # A step has none of these problems: it runs after checkout, it is a real `docker run` with
    # the flags in the right places, and it can wait for readiness explicitly.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: media-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      # The S3 upload tests are not pure object-plane tests: they prove an upload becomes a
      # committed journal_object and survives a restart, which is a database claim. MySqlFixture
      # FAILS rather than skips without one, so the job has to provide it. Same shape as
      # conversations-tests and orchestrator-migrations.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two SeaweedFS containers, started HERE rather than as services — see the note above the
      # `services:` block for why a service container cannot carry them.
      #
      #   8333 anonymous  — the data plane. No identity, so the suite's anonymous client works and
      #                     the assertions are about bytes rather than about authentication.
      #   8334 signed     — `-s3.iam.config` naming the identity in tests/fixtures. This is what
      #                     makes the credential classes and the operator CLI testable at all: the
      #                     operator verbs build their store through the real constructor and
      #                     therefore ALWAYS sign, and against the anonymous bucket every one of
      #                     those calls is answered 400.
      #
      # Both are pinned by digest, same image as before. Readiness is waited for explicitly because
      # there is no service health-check to wait on: a bucket that is not listening yet is a
      # mysterious 400 or a refused connection in the middle of the suite otherwise.
      - name: Start the SeaweedFS fixtures
        run: |
          set -euo pipefail
          IMAGE=chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d

          # 127.0.0.1, not the container's own address: the suite connects to the published port on
          # the runner, exactly as it did with services.
          #
          # ⚠️ BOTH containers name an identity config, including the primary one. An earlier shape
          # ran the primary container with no identity and had the fixture create its bucket over
          # the filer's HTTP API. That could never have worked, for two reasons, both structural:
          #
          #   1. A bucket is the directory immediately under the filer's `DirBuckets` directory
          #      (`/buckets`), which is where `weed s3` puts it. A multipart POST to the filer ROOT
          #      creates a top-level directory whose parent is `/`, so `Filer.IsBucket` is false and
          #      the S3 layer never sees it: 201 from the filer, permanent 404 from `HeadBucket`.
          #      That is exactly what run 36652704531 measured.
          #   2. The one call that DOES create a bucket — an authenticated PUT for an `Admin`
          #      identity — requires a server that has an identity. A server with no identity
          #      cannot create a bucket by any route available to this suite.
          #
          # ⚠️ Also note the filer's HTTP port has never been on the path for bucket creation:
          # `weed s3` dials the filer over gRPC (`filer.port.grpc`), so no amount of waiting on
          # :8888 could have changed this result.
          #
          # The primary config names `anonymous` with `Admin` so unsigned requests still work if a
          # future fixture wants them, and `fleet-ci` for the PUT that creates the bucket.
          docker run -d --name weed-anon -p 127.0.0.1:8333:8333 -p 127.0.0.1:8888:8888 \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            --entrypoint weed "$IMAGE" \
            server -s3 -dir=/data -ip=0.0.0.0 \
            -s3.port=8333 -master.port=9333 -master.port.grpc=19333 \
            -volume.port=8444 -filer.port=8888 -filer.port.grpc=48888 \
            -s3.iam.config=/fixtures/seaweedfs-primary-identity.json \
            -s3.port.iceberg=0 -s3.port.lance=0

          # The identity file is in the checkout, so it is mounted now that checkout has run.
          docker run -d --name weed-signed -p 127.0.0.1:8334:8333 -p 127.0.0.1:8889:8888 \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            --entrypoint weed "$IMAGE" \
            server -s3 -dir=/data -ip=0.0.0.0 \
            -s3.port=8333 -master.port=9334 -master.port.grpc=19334 \
            -volume.port=8445 -filer.port=8888 -filer.port.grpc=48889 \
            -s3.iam.config=/fixtures/seaweedfs-signed-identity.json \
            -s3.port.iceberg=0 -s3.port.lance=0

          # Wait until each container's S3 endpoint ANSWERS OVER HTTP, not merely until the port
          # accepts a connection.
          #
          # ⚠️ An earlier shape of this loop also TCP-probed the filer gRPC ports 48888/48889, and
          # that alone failed the job: those ports are never published to the runner, so the host
          # probe can never succeed no matter how healthy the container is. It timed out at
          # "seaweedfs on :48888 never listened" on run 36656155673, before a single test ran.
          #
          # Publishing them would be the wrong fix — the tests never touch those ports. What the
          # suite actually uses is the published S3 endpoint, so that is what gets polled, and the
          # probe is HTTP rather than TCP: `weed server` starts master, then volume, then filer,
          # then S3, and `startS3Server` reads the filer's configuration over gRPC BEFORE it builds
          # its router. An S3 endpoint that answers over HTTP therefore already proves the filer is
          # reachable, which is exactly the dependency worth waiting for.
          #
          # The accepted set is {200, 403, 404}, measured against the pinned image with both
          # containers' identity configs in place:
          #   200  unauthenticated ListAllMyBuckets on the primary container, which names an
          #        `anonymous` identity — empty <Buckets/> on a fresh server, so it proves nothing
          #        about buckets and everything about readiness
          #   403  the signed container, which names only a keyed identity: AccessDenied is a
          #        WORKING server refusing an anonymous caller, and treating it as not-ready would
          #        hang the job on a fixture that is fine
          #   404  a bucket-level path that this gateway does not route
          # Anything else — a refused connection, a 5xx, a hang — is not ready yet.
          wait_for_s3() {
            local name=$1 url=$2 body i
            for i in $(seq 1 60); do
              # `|| true`: while the port is not listening yet curl exits non-zero, which under
              # `set -e` would end the job instead of falling through to the next attempt.
              body=$(curl -sS -m 5 -o /dev/null -w '%{http_code}' "$url" 2>/dev/null || true)
              case "$body" in
                200|403|404)
                  echo "seaweedfs $name answered $body over HTTP"
                  return 0
                  ;;
              esac
              if [ "$i" -eq 60 ]; then
                echo "ERROR: seaweedfs $name never answered over HTTP at $url (last: $body). Logs:"
                docker ps -a
                docker logs weed-anon || true
                docker logs weed-signed || true
                exit 1
              fi
              sleep 2
            done
          }
          wait_for_s3 weed-anon "http://127.0.0.1:8333/"
          wait_for_s3 weed-signed "http://127.0.0.1:8334/"

          # Prove both mounts actually landed, so a wrong path is THIS step's failure and not a
          # confusing "the store refused an authenticated PUT" from the fixture.
          docker exec weed-anon test -r /fixtures/seaweedfs-primary-identity.json
          echo "primary identity is mounted in weed-anon"
          docker exec weed-signed test -r /fixtures/seaweedfs-signed-identity.json
          echo "signed identity is mounted in weed-signed"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Fleet.Conversations (Release)
        run: dotnet build src/Fleet.Conversations/Fleet.Conversations.csproj --no-restore --configuration Release

      - name: Run the S3 media suite
        env:
          # The primary bucket is created by, and written through, a SIGNED request: the only call
          # that creates a bucket on SeaweedFS is an authenticated PUT for an `Admin` identity, so
          # the fixture's client signs with the pair below. The values are fixture constants for
          # throwaway containers on an ephemeral runner; no deployment uses them.
          #
          # They must be byte-identical to the credentials named in
          # tests/fixtures/seaweedfs-primary-identity.json — SeaweedFS looks an access key up
          # exactly, and a key the file does not name is answered 403 InvalidAccessKeyId.
          FLEET_COMMS_S3_ENDPOINT: "http://127.0.0.1:8333"
          FLEET_COMMS_S3_BUCKET: "journal-ci"
          FLEET_COMMS_S3_ACCESS_KEY: "placeholder"
          FLEET_COMMS_S3_SECRET_KEY: "placeholder"
          # The S3 upload tests ride the same scratch database as the rest of the suite.
          FLEET_CONVERSATIONS_MIGRATION_CONNECTION: "Server=127.0.0.1;Port=3306;User ID=root;Password=media-ci;AllowPublicKeyRetrieval=true;"
          # The SECOND SeaweedFS (`weed-signed`), with an identity configured, is what makes the
          # credential classes and the operator commands testable at all. Read by S3Fixture.
          FLEET_COMMS_S3_SIGNED_ENDPOINT: "http://127.0.0.1:8334"
          # The signed identity is a fixture constant (S3Fixture.SignedAccessKey), not an env var:
          # it is a throwaway container on an ephemeral runner and there is no secret to hide.
        run: >
          dotnet test tests/Fleet.Conversations.Tests --configuration Release
          --filter "FullyQualifiedName~JournalS3"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=media-s3.trx"
          --results-directory ${{ github.workspace }}/testresults

      # The containers this step started are not service containers, so the runner does not stop
      # them. Left running they hold 8333/8334 against the next job on this runner, and a leaked
      # container is far harder to notice than a step that failed.
      - name: Stop the SeaweedFS fixtures
        if: always()
        run: docker rm -f weed-anon weed-signed || true

      # Same rule as the MySQL job: a filter that matched nothing would report success with zero
      # tests executed, which is the exact shape of a gate that quietly stopped gating.
      - name: Refuse a run that skipped or found nothing
        if: always()
        run: |
          set -euo pipefail
          trx="${{ github.workspace }}/testresults/media-s3.trx"

          if [ ! -f "$trx" ]; then
            echo "ERROR: no test result file at $trx — the S3 suite did not run."
            exit 1
          fi

          counters=$(grep -o '<Counters[^>]*>' "$trx" | head -1)
          echo "$counters"

          read_count() { echo "$counters" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' || echo ""; }

          executed=$(read_count executed)
          notExecuted=$(read_count notExecuted)
          passed=$(read_count passed)

          if [ -z "$executed" ] || [ -z "$notExecuted" ] || [ -z "$passed" ]; then
            echo "ERROR: could not read the counters out of $trx."
            exit 1
          fi

          if [ "$notExecuted" -ne 0 ]; then
            echo "ERROR: $notExecuted test(s) did not execute."
            exit 1
          fi

          # The filter is the only way this job could run nothing; a zero count means the tests it
          # is named for are gone, which is a failure and not a pass.
          if [ "${executed:-0}" -lt 10 ] || [ "$passed" -ne "$executed" ]; then
            echo "ERROR: executed=$executed passed=$passed — expected at least 10 S3 tests, all passing."
            exit 1
          fi

          echo "$passed S3 media test(s) executed against SeaweedFS, 0 skipped."

  orchestrator-migrations:
    name: Orchestrator migrations (MySQL)
    runs-on: ubuntu-latest

    # Pomelo migrations only run on MySQL, so this is the one place a migration's effect on a
    # populated schema is proven. Like conversations-tests, the suite FAILS without a database.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: orchestrator-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run the migration suite
        env:
          FLEET_ORCHESTRATOR_MIGRATION_CONNECTION: "Server=127.0.0.1;Port=3306;User ID=root;Password=orchestrator-ci;AllowPublicKeyRetrieval=true;"
        run: >
          dotnet test tests/Fleet.Orchestrator.Tests --configuration Release
          --filter "FullyQualifiedName~Fleet.Orchestrator.Tests.Migrations"
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=orchestrator-migrations.trx"
          --results-directory ${{ github.workspace }}/testresults

      - name: Refuse a run that skipped anything
        if: always()
        run: |
          set -euo pipefail
          trx="${{ github.workspace }}/testresults/orchestrator-migrations.trx"
          [ -f "$trx" ] || { echo "ERROR: no test result file — the suite did not run."; exit 1; }
          counters=$(grep -o '<Counters[^>]*>' "$trx" | head -1)
          echo "$counters"
          read_count() { echo "$counters" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' || echo ""; }
          executed=$(read_count executed); notExecuted=$(read_count notExecuted); passed=$(read_count passed)
          if [ -z "$executed" ] || [ "$notExecuted" != "0" ] || [ "$executed" -eq 0 ] || [ "$passed" -ne "$executed" ]; then
            echo "ERROR: executed=$executed notExecuted=$notExecuted passed=$passed — evidence only when every test ran and passed."
            exit 1
          fi
          echo "$passed test(s) executed against mysql:8.0, 0 skipped."

  whisper-tests:
    name: Whisper service tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        # Mirrors whisper/Dockerfile, minus faster-whisper: the tests stub the
        # model runtime so no real model is ever loaded.
        run: |
          pip install \
            fastapi==0.115.6 \
            python-multipart==0.0.20 \
            pytest==8.3.4

      - name: Test
        run: pytest whisper/tests -v

  codex-schema-drift:
    name: Codex app-server schema drift (G10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned codex CLI
        run: npm install -g @openai/codex@0.153.4 --silent

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Generate schema from pinned CLI
        run: codex app-server generate-json-schema --out /tmp/schema-live/

      - name: Diff against committed schema (key-order insensitive)
        run: |
          set -euo pipefail
          COMMITTED=protocols/codex-app-server-v2
          LIVE=/tmp/schema-live
          DIFFS=0
          # Compare each JSON file using jq -S (sorted keys) to ignore formatting/key-order.
          while IFS= read -r -d '' live_file; do
            rel="${live_file#$LIVE/}"
            committed_file="$COMMITTED/$rel"
            if [ ! -f "$committed_file" ]; then
              echo "NEW FILE in live schema not in committed: $rel"
              DIFFS=$((DIFFS+1))
              continue
            fi
            if ! diff <(jq -S . "$committed_file") <(jq -S . "$live_file") > /dev/null 2>&1; then
              echo "DRIFT: $rel"
              diff <(jq -S . "$committed_file") <(jq -S . "$live_file") || true
              DIFFS=$((DIFFS+1))
            fi
          done < <(find "$LIVE" -name "*.json" -print0)
          # Also check for files committed but absent from live output.
          while IFS= read -r -d '' committed_file; do
            rel="${committed_file#$COMMITTED/}"
            if [ ! -f "$LIVE/$rel" ]; then
              echo "REMOVED FILE in live schema: $rel"
              DIFFS=$((DIFFS+1))
            fi
          done < <(find "$COMMITTED" -name "*.json" -print0)
          if [ "$DIFFS" -gt 0 ]; then
            echo "ERROR: $DIFFS file(s) drifted. Regenerate and commit:"
            echo "  npm install -g @openai/codex@<new-version>"
            echo "  codex app-server generate-json-schema --out protocols/codex-app-server-v2/"
            echo "  git add protocols/codex-app-server-v2/ && git commit"
            exit 1
          fi
          echo "Schema matches pinned @openai/codex@0.153.4 (key-order insensitive)"

  comms-image:
    name: Fleet.Comms image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A green `dotnet build` on a full checkout proves nothing about whether the IMAGE builds:
      # the container has a different build tree. A project reference that escapes the project
      # directory resolves fine on a full checkout and not at all inside a narrower Docker context,
      # so a full test suite can pass on a commit whose image cannot build. This job runs the real
      # build from the real repository root.
      - name: Build the image
        run: docker build -f src/Fleet.Comms/Dockerfile -t fleet:comms-ci .

      # The Dockerfile installs curl for the container healthcheck. Asserting it from the image
      # rather than from the Dockerfile text: a healthcheck whose binary is missing is a probe that
      # can never pass, and a gate that can never pass teaches everyone to ignore the signal.
      - name: curl is present in the image
        run: docker run --rm --entrypoint curl fleet:comms-ci --version

      # The auth store directory must NOT exist in the image. If it did, a missing volume would be
      # served silently from container storage and every device would be forgotten on the next
      # recreation, instead of failing loudly through /ready.
      # Asserted INSIDE the container, with the container invocation itself required to succeed.
      # An `if docker run ... '[ -d ... ]'` treats every non-zero exit as proof of absence, so a
      # daemon that failed to launch the container at all would print "absent" and pass — a launch
      # failure is not an observation of the image filesystem.
      - name: The auth store directory is absent from the image
        run: |
          docker run --rm --entrypoint sh fleet:comms-ci -c \
            'test ! -d /var/lib/fleet-comms || { echo "ERROR: /var/lib/fleet-comms exists in the image."; exit 1; }'
          echo "absent, as required (container ran and reported it)"

      # A configuration rejection must STOP the container, promptly, with a non-zero code.
      #
      # Container acceptance on an earlier head found the opposite: with the store path absent the
      # process wrote its message, bound no listener, and then sat at ~99% CPU indefinitely. Docker
      # reports that as `running`, so `restart: unless-stopped` never fires and a deployment that
      # can serve nothing looks alive. This is the container-level regression for it, and it belongs
      # here because this is the only job with a daemon.
      - name: A missing or blank store path exits non-zero, promptly
        run: |
          set -euo pipefail
          for value in "MISSING" "" "   "; do
            if [ "$value" = "MISSING" ]; then
              args=()
              label="missing"
            else
              args=(-e "Comms__AuthStorePath=$value")
              label="blank('"'"'$value'"'"')"
            fi

            start=$(date +%s)
            set +e
            # --stop-timeout guards the hang: if the process does not exit, `timeout` kills the
            # client and the container is removed below, and the assertion fails.
            timeout 60 docker run --rm "${args[@]}" fleet:comms-ci >/tmp/out 2>&1
            status=$?
            set -e
            elapsed=$(( $(date +%s) - start ))

            echo "--- $label: exit=$status after ${elapsed}s"
            head -3 /tmp/out || true

            if [ "$status" -eq 124 ]; then
              echo "ERROR: the container did not exit — a misconfigured deployment must not look alive."
              exit 1
            fi
            if [ "$status" -eq 0 ]; then
              echo "ERROR: a missing/blank store path must not be a successful start."
              exit 1
            fi
            if [ "$status" -ge 128 ]; then
              echo "ERROR: exited on signal $status; configuration rejection must be a clean exit."
              exit 1
            fi
            if [ "$elapsed" -gt 30 ]; then
              echo "ERROR: took ${elapsed}s to exit; it must fail fast."
              exit 1
            fi
            grep -q "AuthStorePath" /tmp/out || {
              echo "ERROR: the log does not name the missing key."; exit 1; }
          done
          echo "missing and blank both exit non-zero, cleanly and promptly"

      - name: Clean up
        if: always()
        run: docker image rm -f fleet:comms-ci || true

  agent-image:
    name: Agent image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nothing else in CI builds the agent image. Its sources are pinned third-party downloads
      # that a vendor can withdraw (#330, #363), and its build-time guards (provider CLI pins, mc,
      # ffmpeg/ffprobe, DejaVu) would otherwise first run on a deploy; a clean runner is where that shows.
      - name: Build the image
        run: docker build -t fleet:agent-ci .

      - name: mc runs and reports the pinned release
        run: docker run --rm --entrypoint mc fleet:agent-ci --version

      - name: ffmpeg and ffprobe run in the image
        run: |
          docker run --rm --entrypoint ffmpeg fleet:agent-ci -version
          docker run --rm --entrypoint ffprobe fleet:agent-ci -version

      # The exact command CLAUDE.md gives agents, on an H.264 .mp4 like the ones Telegram sends.
      - name: Frame extraction from an .mp4 produces JPEGs
        run: |
          docker run --rm -i --entrypoint sh fleet:agent-ci -s <<'EOF'
          set -eu
          cd /tmp
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=12:size=320x240:rate=25 \
            -c:v libx264 -pix_fmt yuv420p in.mp4
          ffmpeg -i in.mp4 -vf fps=1/2 -frames:v 6 /tmp/f_%02d.jpg
          n=0
          for f in /tmp/f_*.jpg; do
            [ "$(od -An -tx1 -N3 "$f" | tr -d ' ')" = "ffd8ff" ] || { echo "ERROR: $f is not a JPEG"; exit 1; }
            n=$((n + 1))
          done
          [ "$n" -eq 6 ] || { echo "ERROR: expected 6 frames, got $n"; exit 1; }
          echo "extracted $n JPEG frames"
          EOF

      # Diagrams agents render (SVG to PNG with sharp) need a font with Latin and Cyrillic glyphs
      # (#371). Without one every character is the same empty box, so the text is compared with a
      # run of private-use characters that no font covers. The PNG is kept for review.
      - name: SVG text renders with Latin and Cyrillic glyphs
        run: |
          mkdir -p "$RUNNER_TEMP/render"
          docker run --rm -i -v "$RUNNER_TEMP/render:/out" --entrypoint sh fleet:agent-ci -s <<'EOF'
          set -eu
          fc-list ':charset=41f 440 438 432 435 442 20 48 65 6c 6f' family | grep -qi dejavu || \
            { echo "ERROR: no DejaVu font covers every character of 'Привет Hello'"; exit 1; }
          mkdir -p /tmp/render && cd /tmp/render
          npm init -y >/dev/null
          npm install --no-audit --no-fund --loglevel=error sharp@0.35.4
          cat > render.js <<'JS'
          const sharp = require('sharp');
          const out = '/out/hello.png';
          const text = 'Привет Hello';
          const svg = (t) => Buffer.from(
            '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="80">' +
            '<rect width="100%" height="100%" fill="#fff"/>' +
            `<text x="16" y="54" font-family="sans-serif" font-size="40" fill="#000">${t}</text></svg>`);
          const pixels = (t) => sharp(svg(t)).raw().toBuffer();
          (async () => {
            await sharp(svg(text)).png().toFile(out);
            const [rendered, boxes] = await Promise.all([pixels(text), pixels('\uE000'.repeat([...text].length))]);
            if (rendered.equals(boxes)) throw new Error('the text rendered as boxes, not glyphs');
            const { channels } = await sharp(out).stats();
            if (channels[0].min > 64) throw new Error(`${out} has no text pixels`);
            console.log(`rendered ${out} with glyphs`);
          })().catch((err) => { console.error(`ERROR: ${err.message}`); process.exit(1); });
          JS
          node render.js
          EOF

      - name: Keep the rendered PNG
        uses: actions/upload-artifact@v4
        with:
          name: svg-text-render
          path: ${{ runner.temp }}/render/hello.png
          if-no-files-found: error

      # Informational: the image size, and how much of it the ffmpeg and font install added, read
      # from the image's own apt history.
      - name: Image size
        run: |
          docker image ls fleet:agent-ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          echo "fleet:agent-ci $(docker image inspect fleet:agent-ci --format '{{.Size}}') bytes"
          docker run --rm -i --entrypoint sh fleet:agent-ci -s <<'EOF'
          set -eu
          pkgs=$(awk '/^Commandline: .*--no-install-recommends ffmpeg/ {f=1; next}
                      f && /^End-Date/ {exit}
                      f && /^Install: / {sub(/^Install: /, ""); print; exit}' /var/log/apt/history.log \
                 | sed 's/([^)]*)//g; s/,/ /g')
          [ -n "$pkgs" ] || { echo "ERROR: no ffmpeg install entry in apt history"; exit 1; }
          kib=$(dpkg-query -W -f='${Installed-Size}\n' $pkgs | awk '{s += $1} END {print s}')
          echo "ffmpeg and font install: $(echo $pkgs | wc -w) packages, $((kib / 1024)) MiB installed"
          EOF

      - name: Clean up
        if: always()
        run: docker image rm -f fleet:agent-ci || true

  # The journal object-store provisioner runs inside the MinIO client image, and that image carries
  # nothing but the `mc` binary. This job is what stops init.sh from ever again reaching a
  # production host and dying three lines into itself.
  #
  # Why a guard and not a real run: MinIO withdrew every anonymous pull channel this repo has
  # (dl.min.io returns 410, Docker Hub `minio/minio` and `quay.io/minio/*` return 401 — measured
  # 2026-09-30), so there is no image to start here. Stated plainly so nobody reads green checks as
  # more than they are: CI proves this script's EXTERNAL DEPENDENCIES and its substitution logic.
  # The first run against a real MinIO on the deploy host remains the proof of the
  # `mc admin policy` verbs — the same gap docs/comms-journal.md records for the startup probe.
  minio-init-dependencies:
    name: MinIO init script dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: init.sh must call nothing but mc and shell builtins
        # The failure this exists for: `sed` on line 76 of the old script. `minio/mc` is built
        # `FROM scratch`, so the call exited 127 AFTER the bucket and the runtime user existed.
        run: ./scripts/check-minio-init-deps.sh

      - name: The bash-only substitution has a bash to run in
        # `${var//pattern/replacement}` is a bashism; dash answers "Bad substitution" (measured on
        # dash 0.5.12). The shebang and the compose entrypoint must agree on bash, so the pair is
        # checked rather than either half — a "tidy" reformat of either one reintroduces the bug.
        run: |
          set -euo pipefail
          SCRIPT=deploy/comms-minio-init/init.sh

          if grep -qE '\$\{[A-Za-z_][A-Za-z0-9_]*//' "$SCRIPT" \
             && [ "$(head -n1 "$SCRIPT")" != '#!/bin/bash' ]; then
            echo "::error::$SCRIPT uses bash pattern substitution but does not declare #!/bin/bash."
            echo "dash rejects \${var//pattern/replacement} with 'Bad substitution'."
            exit 1
          fi

          if ! grep -q 'entrypoint: \["/bin/bash", "/init/init.sh"\]' docker-compose.example.yml; then
            echo "::error::docker-compose.example.yml must invoke init.sh with /bin/bash, not /bin/sh."
            echo "The substitution in init.sh is a bashism; /bin/sh (dash) fails with 'Bad substitution'."
            exit 1
          fi
          echo "bash is declared in both the shebang and the compose entrypoint."

      - name: The bucket substitution produces the policy that mc is handed
        # The defect, replayed without a MinIO server: run the substitution block taken from the
        # SHIPPED script against the SHIPPED policy file, and assert the result is valid JSON naming
        # the configured bucket with no placeholder left. This is what would have failed red on the
        # `sed` version, because the file it was meant to write was never written at all.
        run: |
          set -euo pipefail

          # Extract the block rather than duplicating it, so this cannot drift from production.
          {
            echo 'set -eu'
            echo 'FLEET_COMMS_MEDIA_BUCKET="journal-prod-2026"'
            sed -n '/^# Read with bash/,/^esac$/p' deploy/comms-minio-init/init.sh
          } > /tmp/subst.sh
          sed -i 's|/init/comms-runtime-policy.json|deploy/comms-minio-init/comms-runtime-policy.json|; s|/tmp/comms-runtime-policy.json|/tmp/policy-out.json|' /tmp/subst.sh

          bash /tmp/subst.sh

          test -s /tmp/policy-out.json || { echo "::error::no policy file was produced"; exit 1; }
          grep -q 'arn:aws:s3:::journal-prod-2026"' /tmp/policy-out.json \
            || { echo "::error::the bucket name was not substituted"; exit 1; }
          grep -q 'arn:aws:s3:::journal-prod-2026/\*"' /tmp/policy-out.json \
            || { echo "::error::the object wildcard resource was not substituted"; exit 1; }
          if grep -q 'comms-journal}' /tmp/policy-out.json; then
            echo "::error::the placeholder survived the substitution"
            exit 1
          fi

          python3 -c 'import json; d=json.load(open("/tmp/policy-out.json")); assert d["Version"]=="2012-10-17"; a=set(d["Statement"][0]["Action"]); assert a=={"s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket","s3:AbortMultipartUpload"}, a; r=set(d["Statement"][0]["Resource"]); assert r=={"arn:aws:s3:::journal-prod-2026","arn:aws:s3:::journal-prod-2026/*"}, r; print("policy JSON valid, actions and resources scoped to the configured bucket")'

      - name: An unsubstituted placeholder fails closed
        # The substitution's other failure mode: if the placeholder and the pattern ever stop
        # matching each other, the result is a policy that names a bucket called `${comms-journal}`
        # — a policy granting nothing, which is the original Access Denied wearing a different hat.
        # `mc admin policy create` would accept that happily, so the script has to refuse it.
        #
        # Simulated by rewriting the PLACEHOLDER in a copy of the real policy file, so the shipped
        # block runs against input whose placeholder it cannot match.
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          sed 's/\${comms-journal}/\${some-other-placeholder}/' \
            deploy/comms-minio-init/comms-runtime-policy.json > "$WORK/policy.json"

          {
            echo 'set -eu'
            echo 'FLEET_COMMS_MEDIA_BUCKET=journal-prod-2026'
            sed -n '/^# Read with bash/,/^esac$/p' deploy/comms-minio-init/init.sh
          } > "$WORK/guard.sh"
          sed -i "s|/init/comms-runtime-policy.json|$WORK/policy.json|; s|/tmp/comms-runtime-policy.json|$WORK/out.json|" "$WORK/guard.sh"

          if bash "$WORK/guard.sh"; then
            echo "::error::the script accepted a policy whose placeholder was never substituted"
            cat "$WORK/out.json" || true
            exit 1
          fi
          echo "an unsubstituted policy fails closed."
