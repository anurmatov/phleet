{
  "id": "codex-subscription-native",
  "display_name": "Codex subscription (UNQUALIFIED trial)",
  "description": "Operator-imported qualification example only; no managed subscription support or runtime authorization",
  "category": "agent",
  "inference_capable": true,
  "annotations": {
    "phleet.dev/status": "UNQUALIFIED",
    "phleet.dev/openshell-source": "bdb956f2cd65a635f1294fccf1d138d263bf650f",
    "phleet.dev/codex-source": "6aaac694803004a63c6f393d153c96d22521a6b9"
  },
  "credentials": [
    {
      "name": "access_token",
      "description": "Gateway-owned access value; only its stock-issued handle reaches the native client",
      "env_vars": [
        "CODEX_AUTH_ACCESS_TOKEN"
      ],
      "required": true,
      "auth_style": "bearer",
      "header_name": "authorization",
      "refresh": {
        "strategy": "oauth2_refresh_token",
        "token_url": "https://auth.openai.com/oauth/token",
        "refresh_before_seconds": 300,
        "max_lifetime_seconds": 3600,
        "material": [
          {
            "name": "client_id",
            "description": "Pinned public native OAuth client ID; no override",
            "required": true
          },
          {
            "name": "refresh_token",
            "description": "Gateway-only material supplied through --secret-material-env; never a workload slot",
            "required": true,
            "secret": true
          }
        ]
      }
    }
  ],
  "discovery": {
    "credentials": [
      "access_token"
    ]
  },
  "endpoints": [
    {
      "host": "chatgpt.com",
      "port": 443,
      "path": "/backend-api/wham/accounts/check",
      "protocol": "rest",
      "enforcement": "enforce",
      "rules": [
        {
          "allow": {
            "method": "GET",
            "path": "/backend-api/wham/accounts/check"
          }
        }
      ]
    },
    {
      "host": "chatgpt.com",
      "port": 443,
      "path": "/backend-api/codex/models",
      "protocol": "rest",
      "enforcement": "enforce",
      "rules": [
        {
          "allow": {
            "method": "GET",
            "path": "/backend-api/codex/models"
          }
        }
      ]
    },
    {
      "host": "chatgpt.com",
      "port": 443,
      "path": "/backend-api/codex/responses",
      "protocol": "rest",
      "enforcement": "enforce",
      "rules": [
        {
          "allow": {
            "method": "POST",
            "path": "/backend-api/codex/responses"
          }
        }
      ]
    }
  ],
  "binaries": [
    "/usr/bin/codex",
    "/usr/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
  ]
}
