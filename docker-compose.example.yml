# Fleet — Full Stack Example
#
# This is a self-contained example that brings up the entire Fleet stack
# using locally-built images. Copy .env.example to .env and fill in your
# values before running.
#
# Recommended:
#   ./setup.sh                      # guided first-time setup
#
# Manual (for users who know what they're doing):
#   cp .env.example .env            # fill in your secrets
#   cp seed.example.json seed.json  # or write your own agent definitions
#   docker compose -p fleet -f docker-compose.example.yml up -d
#
# Credentials: setup.sh copies your AI provider OAuth credentials into
# ${FLEET_BASE_DIR} so containers can mount them without exposing your
# host credential dirs. If you're running this compose file without
# setup.sh, make sure the following files exist under ${FLEET_BASE_DIR}:
#   .claude-credentials.json  — copy of ~/.claude/.credentials.json
#   .codex-credentials.json   — copy of ~/.codex/auth.json (if using codex)
#   .gemini-credentials.json  — copy of ~/.gemini/oauth_creds.json (if using gemini)

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fleet-net

  fleet-mysql:
    image: mysql:8.0
    container_name: fleet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${FLEET_MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: fleet_orchestrator
      MYSQL_USER: fleet
      MYSQL_PASSWORD: ${FLEET_MYSQL_PASSWORD:-fleetpass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - fleet_mysql_data:/var/lib/mysql
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fleet", "--password=${FLEET_MYSQL_PASSWORD:-fleetpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  temporal-postgresql:
    image: postgres:16
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  temporal-server:
    image: temporalio/auto-setup:1.29.1
    container_name: temporal-server
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - BIND_ON_IP=0.0.0.0
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--namespace", "default"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - fleet-net

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      temporal-server:
        condition: service_healthy
    networks:
      - fleet-net

  # ── MinIO (optional — for agent file sharing) ──────────────────────────────

  fleet-minio:
    image: minio/minio
    container_name: fleet-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  fleet-minio-init:
    image: minio/mc
    container_name: fleet-minio-init
    depends_on:
      fleet-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c", "mc alias set fleet http://fleet-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing fleet/share && mc anonymous set public fleet/share"]
    restart: on-failure
    networks:
      - fleet-net

  # ── AI services (speech + voice) ──────────────────────────────────────────

  fleet-whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    image: fleet:whisper
    pull_policy: never
    container_name: fleet-whisper
    environment:
      - WHISPER_MODEL=small
      - WHISPER_HOTWORDS=${WHISPER_HOTWORDS:-}
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fleet-kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: fleet-kokoro-tts
    mem_limit: 4g
    restart: unless-stopped
    networks:
      - fleet-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Fleet services ─────────────────────────────────────────────────────────

  fleet-memory:
    build:
      context: .
      dockerfile: src/Fleet.Memory/Dockerfile
    image: fleet:memory
    container_name: fleet-memory
    ports:
      - "3100:3100"
    volumes:
      - ${FLEET_BASE_DIR}/memories:/data/memories
    environment:
      - Storage__Path=/data/memories
      - Qdrant__Url=http://qdrant:6334
      - Qdrant__Collection=fleet_memories
      # Use ONNX embedding by default (no external dependency).
      # To use Ollama: set Embedding__Provider=ollama and configure Embedding__Ollama__* below.
      - Embedding__Provider=${FLEET_MEMORY_EMBEDDING_PROVIDER:-onnx}
      - Embedding__Dimensions=${FLEET_MEMORY_EMBEDDING_DIMENSIONS:-384}
      - Embedding__Ollama__Url=${FLEET_MEMORY_OLLAMA_URL:-http://host.docker.internal:11434}
      - Embedding__Ollama__Model=${FLEET_MEMORY_OLLAMA_MODEL:-nomic-embed-text}
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  fleet-telegram:
    build:
      context: .
      dockerfile: src/Fleet.Telegram/Dockerfile
    image: fleet:telegram
    container_name: fleet-telegram
    environment:
      - ORCHESTRATOR_URL=http://fleet-orchestrator:3600
      - ORCHESTRATOR_CONFIG_TOKEN=${ORCHESTRATOR_CONFIG_TOKEN}
      - RABBITMQ_URL=amqp://rabbitmq
      # Literal keys to fetch from orchestrator on startup and re-fetch on config.changed events.
      - PEER_CONFIG_KEYS=FLEET_CTO_AGENT,TELEGRAM_CTO_BOT_TOKEN,TELEGRAM_NOTIFIER_BOT_TOKEN,TELEGRAM_USER_ID
      # Template keys: {SHORTNAME} is expanded per-agent to pull per-agent bot tokens
      # (for non-CTO agents that need their own dedicated bot).
      - PEER_AGENT_DERIVED_KEYS=TELEGRAM_{SHORTNAME}_BOT_TOKEN
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      fleet-orchestrator:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3800/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  fleet-bridge:
    build:
      context: .
      dockerfile: src/Fleet.Bridge/Dockerfile
    image: fleet:bridge
    container_name: fleet-bridge
    ports:
      - "3300:3300"
    environment:
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Exchange=fleet.group
      - Bridge__TimeoutSeconds=300
      - ORCHESTRATOR_URL=http://fleet-orchestrator:3600
      - ORCHESTRATOR_CONFIG_TOKEN=${ORCHESTRATOR_CONFIG_TOKEN}
      - RABBITMQ_URL=amqp://rabbitmq
      # Keys to self-update when config.changed is broadcast.
      - PEER_CONFIG_KEYS=FLEET_CTO_AGENT,FLEET_GROUP_CHAT_ID,TELEGRAM_NOTIFIER_BOT_TOKEN
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      fleet-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3300/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  fleet-temporal-bridge:
    build:
      context: .
      dockerfile: Dockerfile.temporal
    image: fleet:temporal-bridge
    container_name: fleet-temporal-bridge
    volumes:
      # Claude credentials — copied by setup.sh from ~/.claude/.credentials.json
      # (or from the macOS keychain "Claude Code-credentials" entry).
      - ${FLEET_BASE_DIR}/.claude-credentials.json:/root/.claude/.credentials.json
      # Codex credentials — copied by setup.sh from ~/.codex/auth.json.
      # If you're not using codex, create an empty placeholder file:
      #   touch ${FLEET_BASE_DIR}/.codex-credentials.json
      - ${FLEET_BASE_DIR}/.codex-credentials.json:/root/.codex/auth.json
      # Gemini credentials — copied by setup.sh from ~/.gemini/oauth_creds.json.
      # Mounted read-write so AuthTokenRefreshWorkflow can write refreshed access tokens.
      # If you're not using gemini, create an empty placeholder file:
      #   touch ${FLEET_BASE_DIR}/.gemini-credentials.json
      - ${FLEET_BASE_DIR}/.gemini-credentials.json:/root/.gemini/oauth_creds.json
    environment:
      - RabbitMq__Host=rabbitmq
      - TemporalBridge__TemporalAddress=temporal-server:7233
      - TemporalBridge__Namespaces__0=fleet
      - TemporalBridge__AgentTimeoutSeconds=1800
      - TemporalBridge__OrchestratorAuthToken=${ORCHESTRATOR_AUTH_TOKEN}
      - TemporalBridge__OrchestratorUrl=http://fleet-orchestrator:3600
      - ORCHESTRATOR_URL=http://fleet-orchestrator:3600
      - ORCHESTRATOR_CONFIG_TOKEN=${ORCHESTRATOR_CONFIG_TOKEN}
      - RABBITMQ_URL=amqp://rabbitmq
      # Dynamic keys fetched from orchestrator at startup and live-updated on config.changed events.
      # FLEET_CTO_AGENT       — CTO agent name for UWE {{config.CtoAgent}} and {{config.EscalationTarget}} template expressions
      # FLEET_GROUP_CHAT_ID   — Telegram group chat ID for activity directives (replaces static TemporalBridge__GroupChatId)
      # AUTHTOKENREFRESH__*   — OAuth client IDs for provider token refresh (applied on restart)
      - PEER_CONFIG_KEYS=FLEET_CTO_AGENT,FLEET_GROUP_CHAT_ID,AUTHTOKENREFRESH__CLAUDECLIENTID,AUTHTOKENREFRESH__CODEXCLIENTID,AUTHTOKENREFRESH__GEMINICLIENTID,AUTHTOKENREFRESH__GEMINICLIENTSECRET
      # OAuth client IDs for provider token refresh workflow (optional — also set as static fallback).
      # Set only if you want the fleet to auto-refresh Claude/Codex/Gemini tokens.
      - AuthTokenRefresh__ClaudeClientId=${AUTHTOKENREFRESH__CLAUDECLIENTID:-}
      - AuthTokenRefresh__CodexClientId=${AUTHTOKENREFRESH__CODEXCLIENTID:-}
      # Gemini OAuth installed-app constants — extracted by setup.sh from the host's
      # @google/gemini-cli npm bundle (the CLI ships these in plaintext; they're public
      # OAuth identifiers, not cryptographic secrets). RefreshGeminiAsync reads them to
      # call https://oauth2.googleapis.com/token; without them the workflow throws a
      # non-retryable failure on every gemini refresh. Empty when gemini provider is
      # not selected — RefreshGeminiAsync is only invoked from auth-token-refresh-gemini-30m
      # which itself only exists if setup.sh saw USE_GEMINI=true.
      - AuthTokenRefresh__GeminiClientId=${AUTHTOKENREFRESH__GEMINICLIENTID:-}
      - AuthTokenRefresh__GeminiClientSecret=${AUTHTOKENREFRESH__GEMINICLIENTSECRET:-}
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      temporal-server:
        condition: service_healthy
      fleet-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  fleet-playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    container_name: fleet-playwright
    command: ["npx", "@playwright/mcp@0.0.70", "--port", "3200", "--host", "0.0.0.0", "--browser", "chromium", "--shared-browser-context", "--allowed-hosts", "*"]
    ports:
      - "3200:3200"
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3200'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net

  fleet-orchestrator:
    build:
      context: .
      dockerfile: src/Fleet.Orchestrator/Dockerfile
    image: fleet:orchestrator
    container_name: fleet-orchestrator
    ports:
      - "3600:3600"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./seed.json:/app/seed.json:ro
      # Bind-mount FLEET_BASE_DIR at the SAME path inside and outside the container.
      # This is required because the orchestrator launches child agent containers
      # via the Docker socket and passes host paths (workspaces, memories, env file)
      # as bind mounts — those paths must resolve identically on the host.
      - ${FLEET_BASE_DIR}:${FLEET_BASE_DIR}
    env_file:
      - .env
    environment:
      - ConnectionStrings__OrchestratorDb=Server=fleet-mysql;Port=3306;Database=fleet_orchestrator;User=fleet;Password=${FLEET_MYSQL_PASSWORD:-fleetpass}
      - RabbitMq__Host=rabbitmq
      - Temporal__Address=temporal-server:7233
      - Temporal__Namespaces__0=fleet
      - Provisioning__SeedFilePath=/app/seed.json
      - Provisioning__BaseDir=${FLEET_BASE_DIR}
      - Provisioning__EnvFilePath=${FLEET_BASE_DIR}/.env
      - Provisioning__DefaultNetwork=fleet-net
      - Provisioning__WhisperServiceUrl=http://fleet-whisper:8080
      - Provisioning__KokoroServiceUrl=http://fleet-kokoro-tts:8880
      - Orchestrator__AuthToken=${ORCHESTRATOR_AUTH_TOKEN}
      - Orchestrator__ConfigToken=${ORCHESTRATOR_CONFIG_TOKEN}
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      fleet-mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      temporal-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3600/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fleet-net

  # ── Fleet.Comms — first-party client API (OPT-IN) ──────────────────────────
  #
  # Auth and session only: device enrollment, token mint, self-revocation and session discovery.
  # There is no chat, no WebSocket, no conversation history and no push. An enrolled device holds
  # a valid token and has nothing to talk to yet.
  #
  # Behind a `comms` profile, so it does not start unless you ask for it. Most phleet installs run
  # Telegram agents and want no public client API; shipping an auth boundary to them by default is
  # the wrong direction for a security decision.
  #
  # The published port defaults to LOOPBACK, unlike temporal-ui or fleet-memory. Those are
  # developer surfaces; this one takes credentials. A host reverse proxy terminates TLS and reaches
  # it here — see docs/comms-deployment.md. rabbitmq, fleet-mysql and fleet-minio bind loopback for
  # the same reason, so this follows an existing precedent rather than inventing one.
  fleet-comms:
    profiles: ["comms"]
    build:
      context: .
      dockerfile: src/Fleet.Comms/Dockerfile
    image: fleet:comms
    pull_policy: never
    container_name: fleet-comms
    ports:
      - "${FLEET_COMMS_BIND:-127.0.0.1:3500}:8080"
    environment:
      # North listener. The ops listener is loopback-only inside the container and is NOT published:
      # /ready reports whether the auth store answers, which on a reachable address is an
      # availability oracle.
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Comms__OpsUrl=http://127.0.0.1:8081
      # Named volume, not a bind mount: SqliteAuthStore runs PRAGMA journal_mode=WAL, and a bind
      # mount onto a macOS or Windows host goes through a virtualised filesystem where SQLite file
      # locking is not dependable. A named volume behaves the same on every platform, and
      # `docker compose down` without -v preserves it — which is what makes upgrade.sh safe.
      - Comms__AuthStorePath=/var/lib/fleet-comms/auth.db
      - Comms__AgentLabel=${FLEET_COMMS_AGENT_LABEL:-assistant}
      # Off unless a reverse proxy is actually in front AND replaces X-Forwarded-For. On a port
      # reachable without one, this hands every caller the rate limiter's partition key.
      - Comms__TrustForwardedHeaders=${FLEET_COMMS_TRUST_PROXY:-false}
      # Set by setup.sh/upgrade.sh after the first successful `store init`. Lives here, not in the
      # volume, so a deleted volume is still recognisable as loss rather than a fresh install.
      - Comms__StoreProvisioned=${FLEET_COMMS_STORE_PROVISIONED:-false}
      # ── Durable conversations (opt-in) ──────────────────────────────────────
      # The presence of the RUNTIME connection string is what enables the feature. Leave it empty
      # and this service is byte-identical to the auth-only deployment: no conversation route, no
      # database connection, no background loop.
      #
      # The runtime account holds SELECT/INSERT/UPDATE/DELETE and NO DDL grants. The migration
      # account is deliberately NOT given to this container — `conversations migrate` is an
      # operator command, run through fleet-comms-ops.
      - Comms__ConversationConnectionString=${FLEET_COMMS_CONVERSATION_DB:-}
      # The SOUTH listener. Container-internal, on the Docker network, and NEVER in the `ports:`
      # block below — a caller who reached /turns:commit could write a terminal for someone else's
      # turn. Its binding rule is the opposite of the ops listener's for a reason: the south caller
      # is a DIFFERENT container, so a loopback bind would make it unreachable by construction.
      - Comms__SouthUrl=${FLEET_COMMS_SOUTH_BIND:-http://0.0.0.0:8082}
      - Comms__SouthBearerToken=${FLEET_COMMS_SOUTH_TOKEN:-}
      - Comms__AgentName=${FLEET_COMMS_AGENT_NAME:-}
      - Comms__BrokerConnectionString=${FLEET_COMMS_BROKER:-}
      # ⚠️ Claim retention must exceed the broker's redelivery horizon AND the longest a submission
      # can wait behind a running turn. See .env.example for why shortening it removes a guard.
      - Comms__Conversations__DeliveryClaimRetention=${FLEET_COMMS_CLAIM_RETENTION:-7.00:00:00}
      - Comms__Conversations__EphemeralEventRetention=${FLEET_COMMS_EPHEMERAL_RETENTION:-1.00:00:00}
      - Comms__Conversations__DurableEventRetention=${FLEET_COMMS_DURABLE_RETENTION:-30.00:00:00}
      - Comms__Conversations__OutboxRetention=${FLEET_COMMS_OUTBOX_RETENTION:-1.00:00:00}
    volumes:
      - fleet_comms_auth:/var/lib/fleet-comms
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      # /ready, not /health: the store initialises lazily, so a liveness probe would report a
      # service that 503s every request as healthy.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - fleet-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The conversation database.
  #
  # ITS OWN MySQL, not a schema on a shared one. The credentials, the blast radius and the backup
  # schedule are separate, and a comms-only install does not necessarily run anything else — a
  # restore of the conversation database must never be entangled with an unrelated service's.
  #
  # ⚠️ NO PUBLISHED HOST PORT. It is reached by fleet-comms over the Docker network and by nothing
  # else. Publishing it would put a database holding conversation history on a host interface.
  comms-mysql:
    profiles: ["comms"]
    image: mysql:8.0
    container_name: comms-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${FLEET_COMMS_MYSQL_ROOT_PASSWORD:-}
      - MYSQL_DATABASE=${FLEET_COMMS_MYSQL_DATABASE:-comms}
    volumes:
      - comms_mysql_data:/var/lib/mysql
      # Provisions the TWO accounts on first start: a DDL one for migrations and a DDL-LESS runtime
      # one. The split is what makes "the service never migrates on startup" a property of the
      # deployment rather than of the code being careful.
      - ./deploy/comms-mysql-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${FLEET_COMMS_MYSQL_ROOT_PASSWORD:-}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fleet-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The operator path, as a one-shot container with logging DISABLED.
  #
  # `enroll issue` prints a bearer credential to stdout, and `docker compose run` creates the
  # one-shot container from its service definition — INCLUDING its logging driver. Running it on
  # fleet-comms would write the code into the engine's json-file log on the host before `--rm`
  # removed the container: `docker logs` would show it, and removal does not un-write the file.
  #
  # Same image, same entrypoint, `logging: none`, no ports, no restart. The API service keeps its
  # rotation; only the operator path opts out of persistence, which is the one place a secret
  # crosses stdout.
  # Its OWN profile, deliberately, and one that is never passed to `up`.
  #
  # Under `profiles: ["comms"]` this service was started by `docker compose --profile comms up -d`
  # as a second long-running Fleet.Comms process against the same database — a writer nobody asked
  # for. `docker compose run` enables the profile of the service it targets, so the operator
  # commands keep working without ever handing this profile to `up`.
  fleet-comms-ops:
    profiles: ["comms-ops"]
    build:
      context: .
      dockerfile: src/Fleet.Comms/Dockerfile
    image: fleet:comms
    pull_policy: never
    environment:
      - Comms__AuthStorePath=/var/lib/fleet-comms/auth.db
      - Comms__StoreProvisioned=${FLEET_COMMS_STORE_PROVISIONED:-false}
      # The DDL credential lives HERE and on no long-running service.
      #
      # `conversations migrate` is the only thing that applies a migration, and this one-shot
      # operator container is the only place it runs. Putting this string on fleet-comms would give
      # the running service the ability to alter its own schema, which is exactly the guard the
      # two-account split exists to provide.
      - Comms__ConversationMigrationConnectionString=${FLEET_COMMS_CONVERSATION_MIGRATION_DB:-}
      # `conversations status` falls back to the runtime string when no DDL one is set, and reading
      # the applied version is a SELECT the runtime account can do — so both are here and the
      # command picks the right one.
      - Comms__ConversationConnectionString=${FLEET_COMMS_CONVERSATION_DB:-}
    volumes:
      - fleet_comms_auth:/var/lib/fleet-comms
    networks:
      - fleet-net
    logging:
      driver: "none"

  fleet-dashboard:
    build:
      context: .
      dockerfile: src/fleet-dashboard/Dockerfile
      args:
        VITE_AUTH_TOKEN: ${ORCHESTRATOR_AUTH_TOKEN:-changeme}
        VITE_CONFIG_TOKEN: ${ORCHESTRATOR_CONFIG_TOKEN:-}
    image: fleet:dashboard
    container_name: fleet-dashboard
    ports:
      - "3700:80"
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      fleet-orchestrator:
        condition: service_healthy
    networks:
      - fleet-net

volumes:
  qdrant_data:
  # Device registrations, enrollment state and tokens. Losing this volume locks the owner out of
  # their own client with no self-service recovery — restore from a `store backup` file.
  comms_mysql_data:
  fleet_comms_auth:
  temporal_pg_data:
  fleet_mysql_data:
  minio_data:

networks:
  fleet-net:
    name: fleet-net
    driver: bridge
