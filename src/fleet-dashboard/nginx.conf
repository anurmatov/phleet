server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # #341: re-resolve at request time.
    # 127.0.0.11 = Docker embedded DNS.
    # valid= overrides its 600s TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # No URI part: with a variable, a URI
    # would REPLACE the whole request URI.
    set $orchestrator_upstream http://fleet-orchestrator:3600;

    # The chat service's device-facing listener.
    # A variable for the same reason, and one
    # more: the service is optional, and a
    # literal host that does not resolve would
    # stop nginx from starting at all.
    set $comms_upstream http://fleet-comms:8080;

    # Internal-only fan-out endpoint; ASP.NET paths are case-insensitive.
    location ~* ^/api/epic-drivers/ {
        return 404;
    }

    # Admission fans out internal reads and must not be exposed by this proxy.
    location ~* ^/api/epic-grants/[^/]+/admission$ {
        return 404;
    }

    # X-Fleet-Edge marks a request as coming
    # from outside: the orchestrator then asks
    # for sign-in on reads too. proxy_set_header
    # REPLACES whatever the client sent, so a
    # client cannot remove the mark.
    location /api/ {
        proxy_pass $orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Fleet-Edge 1;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ws {
        proxy_pass $orchestrator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Fleet-Edge 1;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # Chat: conversations and their live stream.
    # One location serves plain requests and the
    # WebSocket upgrade, so Connection is passed
    # through as the client sent it.
    location /v1/ {
        proxy_pass $comms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        # Above the largest attachment the chat
        # service accepts (8 MiB), which is the
        # limit that should answer, not this one.
        client_max_body_size 9m;
    }

    location /health {
        proxy_pass $orchestrator_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
