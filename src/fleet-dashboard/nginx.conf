server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # #341: re-resolve at request time.
    # 127.0.0.11 = Docker embedded DNS.
    # valid= overrides its 600s TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # No URI part: with a variable, a URI
    # would REPLACE the whole request URI.
    set $orchestrator_upstream http://fleet-orchestrator:3600;

    location /api/ {
        proxy_pass $orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass $orchestrator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass $orchestrator_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
