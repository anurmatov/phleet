# Frozen copy of src/fleet-dashboard/nginx.conf as of main @ 9a2b6cc,
# BEFORE #341. Negative-control fixture for tests/dashboard-proxy/run.sh:
# the literal proxy_pass host makes nginx resolve once at config load, so the
# harness must exit 1 at P2 (recreate). Do not "fix" this file.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API to orchestrator
    location /api/ {
        proxy_pass http://fleet-orchestrator:3600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy WebSocket to orchestrator
    location /ws {
        proxy_pass http://fleet-orchestrator:3600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Health check
    location /health {
        proxy_pass http://fleet-orchestrator:3600/health;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
